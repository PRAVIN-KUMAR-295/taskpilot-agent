<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskPilot AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="app">

        <header class="header">
            <div>
                <h1>TaskPilot AI</h1>
                <p>Autonomous AI Productivity Agent</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
        </header>


        <main class="chat-container">

            <div
                id="chatBox"
                class="chat-box"
            >

                <div class="message assistant">
                    <div class="avatar">AI</div>

                    <div class="message-content">
                        <div class="sender">
                            TaskPilot
                        </div>

                        <div class="bubble">
                            Hi! I'm TaskPilot. Tell me what you want to do.
                        </div>
                    </div>
                </div>

            </div>


            <div class="input-area">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Ask TaskPilot..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    type="button"
                >
                    Send
                </button>

            </div>

        </main>

    </div>


    <script src="app.js"></script>

</body>

</html>
